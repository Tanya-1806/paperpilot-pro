
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: paperpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperpilot
      POSTGRES_USER: paperpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - paperpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperpilot -d paperpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paperpilot_postgres_data:
